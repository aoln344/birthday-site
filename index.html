<h1>誕生日を選んでね</h1>

<select id="month">
  <option value="">月</option>
  <script>
    for (let i = 1; i <= 12; i++) {
      document.write(`<option value="${i}">${i}月</option>`);
    }
  </script>
</select>

<select id="day">
  <option value="">日</option>
  <script>
    for (let i = 1; i <= 31; i++) {
      document.write(`<option value="${i}">${i}日</option>`);
    }
  </script>
</select>

<br><br>

<button onclick="showMessage()">メッセージを見る</button>

<div id="message"></div>

<script>
function showMessage() {
  const month = document.getElementById("month").value;
  const day = document.getElementById("day").value;

  if (!month || !day) {
    alert("月日を選んでください！");
    return;
  }

  const key = month + "-" + day;

  const messages = {
    "1-1": "新年生まれ！✨",
    "2-14": "バレンタイン💖",
    "4-20": "今日生まれ🎉",
    "12-25": "クリスマス🎄"
  };

  const msg = messages[key] || "素敵な誕生日だね✨";

  document.getElementById("message").innerText = msg;
}
</script>
