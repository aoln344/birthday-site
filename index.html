<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Day</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,200;0,300;1,200&family=Noto+Sans+JP:wght@200;300&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f7f5f2;
  --ink: #111;
  --sub: #999;
  --accent: #ff4d6d;
  --accent2: #8a5cff;
  --line: #d8d6d2;
}
body {
  min-height: 100vh;
  background: var(--bg);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'DM Sans', 'Noto Sans JP', sans-serif;
  color: var(--ink);
  overflow: hidden;
}
.wrap {
  width: min(90vw, 320px);
  opacity: 0;
  transform: translateY(16px);
  animation: fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) 0.2s forwards;
}
@keyframes fadeUp { to { opacity:1; transform:translateY(0); } }
.label {
  font-size: 11px; font-weight: 300;
  letter-spacing: 0.22em; color: var(--sub);
  text-transform: uppercase; margin-bottom: 12px;
}
h1 {
  font-size: clamp(18px, 4.5vw, 28px);
  font-weight: 200; line-height: 1.25;
  letter-spacing: -0.02em; margin-bottom: 40px;
  background: linear-gradient(90deg, #ff4d6d, #8a5cff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; white-space: nowrap;
}
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
select {
  appearance: none; width: 100%;
  padding: 14px 16px; background: white;
  border: 1.5px solid var(--line); border-radius: 10px;
  font-family: inherit; font-size: 15px; font-weight: 300;
  color: var(--ink); cursor: pointer; outline: none;
  transition: border-color 0.2s;
}
select:focus { border-color: var(--accent); }
button.main {
  width: 100%; margin-top: 4px; padding: 15px;
  background: var(--ink); color: white; border: none;
  border-radius: 10px; font-family: inherit; font-size: 14px;
  font-weight: 300; letter-spacing: 0.06em;
  cursor: pointer; transition: background 0.25s, transform 0.15s;
}
button.main + button.main { margin-top: 10px; }
button.main:hover { background: #333; }
button.main:active { transform: scale(0.98); }

#stage {
  position: fixed; inset: 0; z-index: 100;
  display: flex; justify-content: center; align-items: center;
  flex-direction: column; gap: 48px;
  opacity: 0; pointer-events: none; transition: opacity 0.4s;
}
#stage.active { opacity: 1; pointer-events: auto; }
#stageBg {
  position: absolute; inset: 0;
  background: rgba(247,245,242,0.94);
  backdrop-filter: blur(10px);
}

#scene {
  position: relative;
  z-index: 10;
  width: 240px;
  height: 360px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  transform: translateY(-40px);
  transition: opacity 0.6s ease, transform 0.7s cubic-bezier(0.16,1,0.3,1);
}
#scene.drop { opacity:1; transform:translateY(0); }

#envelope-svg {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 240px;
  overflow: visible;
  filter: drop-shadow(0 8px 24px rgba(0,0,0,0.08));
}

#card {
  position: absolute;
  left: 12px;
  width: 216px;
  background: white;
  border: 1px solid #e8e6e2;
  border-radius: 6px;
  padding: 26px 22px 22px;
  text-align: center;
  box-shadow: 0 2px 16px rgba(0,0,0,0.08);
  z-index: 4;
  bottom: 8px;
  opacity: 0;
  transition: bottom 0.75s cubic-bezier(0.16,1,0.3,1), opacity 0.5s ease;
}
#card.rise {
  bottom: 195px;
  opacity: 1;
}

.card-date {
  font-size: 12px; font-weight: 300;
  letter-spacing: 0.2em; color: var(--sub);
  text-transform: uppercase; margin-bottom: 10px;
}
.card-line {
  width: 32px; height: 1.5px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  margin: 0 auto 10px;
}
.card-msg {
  font-size: 17px; font-weight: 300;
  line-height: 1.7; color: var(--ink);
  letter-spacing: 0.03em;
}

#closeBtn {
  position: relative; z-index: 20;
  background: transparent;
  border: 1px solid var(--line); border-radius: 99px;
  padding: 10px 32px;
  font-family: inherit; font-size: 12px;
  font-weight: 300; letter-spacing: 0.14em;
  color: var(--sub); cursor: pointer;
  opacity: 0; transition: opacity 0.4s, color 0.2s, border-color 0.2s;
  white-space: nowrap;
}
#closeBtn.show { opacity: 1; }
#closeBtn:hover { color: var(--ink); border-color: var(--ink); }

.spark {
  position: fixed; z-index: 300;
  pointer-events: none; border-radius: 50%;
  animation: sparkFly var(--dur) ease-out forwards;
}
@keyframes sparkFly {
  0%   { opacity:1; transform: translate(0,0) scale(1); }
  100% { opacity:0; transform: translate(var(--tx),var(--ty)) scale(0.2); }
}
</style>
</head>
<body>

<div class="wrap" id="wrap">
  <p class="label">Special Day</p>
  <h1>誕生日をおしえてね</h1>
  <div class="row">
    <select id="month"><option value="">月</option></select>
    <select id="day"><option value="">日</option></select>
  </div>
  <button class="main" onclick="showMessage()">メッセージを見る</button>
</div>

<div id="stage">
  <div id="stageBg"></div>

  <div id="scene">
    <div id="card">
      <p class="card-date" id="cardDate"></p>
      <div class="card-line"></div>
      <p class="card-msg" id="cardMsg"></p>
    </div>

    <svg id="envelope-svg" viewBox="0 0 240 250" xmlns="http://www.w3.org/2000/svg" overflow="visible" height="250">
      <!-- 封筒内側上半分（フラップが開くと見える部分）: グレー -->
      <path d="M0,90 L120,172 L240,90 L240,90 L0,90 Z" fill="#e0deda"/>
      <!-- 封筒白塗り（下半分は白） -->
      <rect x="0" y="90" width="240" height="160" rx="4" fill="white"/>
      <!-- 封筒上半分内側グレー（フラップが隠していたエリア）を三角で上書き -->
      <path id="inner-shadow" d="M0,90 L120,172 L240,90 Z" fill="#e0deda"/>
      <!-- フラップ: 閉=白(表面), 開=グレー(裏面) -->
      <path id="flap-path" d="M0,90 L120,172 L240,90" fill="white" stroke="none"/>
      <path id="flap-stroke" d="M0,90 L120,172 L240,90" fill="none" stroke="#d8d6d2" stroke-width="1.2" stroke-linejoin="round"/>
      <rect x="0" y="90" width="240" height="160" rx="4" fill="none" stroke="#d8d6d2" stroke-width="1.2"/>
      <polyline points="0,250 120,185 240,250" fill="none" stroke="#d8d6d2" stroke-width="1.2"/>
      <line x1="0" y1="90" x2="120" y2="165" stroke="#d8d6d2" stroke-width="1.2"/>
      <line x1="240" y1="90" x2="120" y2="165" stroke="#d8d6d2" stroke-width="1.2"/>
      <line x1="0" y1="90" x2="240" y2="90" stroke="#d8d6d2" stroke-width="1.2"/>
    </svg>
  </div>

  <button id="closeBtn" onclick="closeStage()">close</button>
</div>

<script>
const monthSel = document.getElementById("month");
const daySel   = document.getElementById("day");
const wrap = document.getElementById("wrap");

for (let i=1;i<=12;i++) monthSel.innerHTML += `<option value="${i}">${i}月</option>`;
for (let i=1;i<=31;i++) daySel.innerHTML   += `<option value="${i}">${i}日</option>`;

// ねこの誕生日
const CAT_BIRTHDAY_MONTH = "5";
const CAT_BIRTHDAY_DAY = "8";

// 正解したときに飛ばすAIチャットページ
const AI_CHAT_PAGE = "ai-chat.html";

const messages = {
  "1-1":  "最高のスタートの日✨",
  "4-13": "いつも一緒にいてくれてありがとう",
  "12-7": "あ！うそつきだ！",
  "2-14": "愛にあふれてる日💖",
  "7-7":  "ロマンチックな日🌟",
  "12-25":"奇跡の存在🎄"
};

function showMessage() {
  const m = monthSel.value, d = daySel.value;
  if (!m || !d) { alert("入力忘れてるよん🙃"); return; }

  if (m === "12" && d === "7") {
    askCatOwner();
    return;
  }

  const key = `${m}-${d}`;
  document.getElementById("cardDate").textContent = `${m}月 ${d}日`;
  document.getElementById("cardMsg").textContent  = messages[key] || "あなたの誕生日は特別な日✨";
  runAnim();
}

function askCatOwner() {
  wrap.innerHTML = `
    <p class="label">Special Question</p>
    <h1>猫飼ってる？</h1>
    <button class="main" onclick="askCatBirthday()">yes</button>
    <button class="main" onclick="showCatNoMessage()">no</button>
  `;
}

function askCatBirthday() {
  wrap.innerHTML = `
    <p class="label">Cat Birthday</p>
    <h1>ねこの誕生日をおしえて</h1>
    <div class="row">
      <select id="catMonth"><option value="">月</option></select>
      <select id="catDay"><option value="">日</option></select>
    </div>
    <button class="main" onclick="checkCatBirthday()">送信</button>
  `;

  const catMonth = document.getElementById("catMonth");
  const catDay = document.getElementById("catDay");

  for (let i = 1; i <= 12; i++) {
    catMonth.innerHTML += `<option value="${i}">${i}月</option>`;
  }

  for (let i = 1; i <= 31; i++) {
    catDay.innerHTML += `<option value="${i}">${i}日</option>`;
  }
}

function checkCatBirthday() {
  const m = document.getElementById("catMonth").value;
  const d = document.getElementById("catDay").value;

  if (!m || !d) {
    alert("ねこの誕生日も入力してね🐈");
    return;
  }

  if (m === CAT_BIRTHDAY_MONTH && d === CAT_BIRTHDAY_DAY) {
    location.href = AI_CHAT_PAGE;
    return;
  }

  document.getElementById("cardDate").textContent = `${m}月 ${d}日`;
  document.getElementById("cardMsg").textContent = "ほんとに覚えてる？🐈";
  runAnim();
}

function showCatNoMessage() {
  document.getElementById("cardDate").textContent = `12月 7日`;
  document.getElementById("cardMsg").textContent = "あ！うそつきだ！";
  runAnim();
}

let flapTimer = null;

function easeOut(t) {
  return 1 - Math.pow(1 - t, 3);
}

function animateFlap(fromY, toY, duration, onComplete) {
  if (flapTimer) cancelAnimationFrame(flapTimer);
  const start = performance.now();
  const flapPath   = document.getElementById("flap-path");
  const flapStroke = document.getElementById("flap-stroke");

  function step(now) {
    const elapsed = now - start;
    const raw = Math.min(elapsed / duration, 1);
    const t = easeOut(raw);
    const curY = fromY + (toY - fromY) * t;
    const d = `M0,90 L120,${curY.toFixed(2)} L240,90`;
    flapPath.setAttribute("d", d);
    flapStroke.setAttribute("d", d);
    if (raw < 1) {
      flapTimer = requestAnimationFrame(step);
    } else {
      flapTimer = null;
      if (onComplete) onComplete();
    }
  }
  flapTimer = requestAnimationFrame(step);
}

function setFlapLayer(isOpen) {
  const flapPath   = document.getElementById("flap-path");
  const flapStroke = document.getElementById("flap-stroke");
  const envSvg     = document.getElementById("envelope-svg");
  const rects      = envSvg.querySelectorAll("rect");

  flapPath.setAttribute("fill", isOpen ? "#e0deda" : "white");

  if (isOpen) {
    envSvg.insertBefore(flapPath,   rects[1].nextSibling);
    envSvg.insertBefore(flapStroke, flapPath.nextSibling);
  } else {
    envSvg.insertBefore(flapPath,   rects[2]);
    envSvg.insertBefore(flapStroke, flapPath.nextSibling);
  }
}

function runAnim() {
  const stage    = document.getElementById("stage");
  const scene    = document.getElementById("scene");
  const card     = document.getElementById("card");
  const closeBtn = document.getElementById("closeBtn");

  scene.classList.remove("drop");
  card.classList.remove("rise");
  card.style.transition = "none";
  closeBtn.classList.remove("show");

  animateFlap(172, 172, 1);
  setFlapLayer(false);

  void scene.offsetWidth;

  stage.classList.add("active");

  setTimeout(() => {
    card.style.transition = "";
    scene.classList.add("drop");
  }, 80);

  setTimeout(() => {
    // レイヤーを後ろへ（色はまだ白のまま開く）
    const flapPath   = document.getElementById("flap-path");
    const flapStroke = document.getElementById("flap-stroke");
    const envSvg     = document.getElementById("envelope-svg");
    const rects      = envSvg.querySelectorAll("rect");
    envSvg.insertBefore(flapPath,   rects[1].nextSibling);
    envSvg.insertBefore(flapStroke, flapPath.nextSibling);
    animateFlap(172, 8, 700, null);
  }, 900);

  // 開ききった後、少し遅れてグレー（裏面）に切り替え
  setTimeout(() => {
    document.getElementById("flap-path").setAttribute("fill", "#e0deda");
  }, 900 + 700 + 120);

  setTimeout(() => {
    card.classList.add("rise");
    spawnSparks();
  }, 1600);

  setTimeout(() => closeBtn.classList.add("show"), 2300);
}

function closeStage() {
  const stage    = document.getElementById("stage");
  const scene    = document.getElementById("scene");
  const card     = document.getElementById("card");
  const closeBtn = document.getElementById("closeBtn");

  closeBtn.classList.remove("show");
  card.classList.remove("rise");

  setTimeout(() => {
    setFlapLayer(false);
    animateFlap(8, 172, 600, null);
  }, 400);

  setTimeout(() => {
    scene.style.transition = "opacity 0.4s, transform 0.4s";
    scene.style.opacity = "0";
    scene.style.transform = "translateY(20px)";
  }, 800);

  setTimeout(() => {
    stage.classList.remove("active");
    scene.style.transition = "";
    scene.style.opacity    = "";
    scene.style.transform  = "";
  }, 1100);
}

function spawnSparks() {
  const colors = ["#ff4d6d","#8a5cff","#ffcc44","#3c8fff","#fff"];
  const svgEl = document.getElementById("envelope-svg");
  const rect = svgEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top  + rect.height / 2;
  for (let i = 0; i < 22; i++) {
    const el = document.createElement("div");
    el.className = "spark";
    const size  = 3 + Math.random() * 4;
    const angle = Math.random() * Math.PI * 2;
    const dist  = 60 + Math.random() * 110;
    el.style.cssText = `
      width:${size}px; height:${size}px;
      left:${cx}px; top:${cy}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      --tx:${Math.cos(angle)*dist}px;
      --ty:${Math.sin(angle)*dist}px;
      --dur:${0.5+Math.random()*0.6}s;
      animation-delay:${Math.random()*0.15}s;
    `;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1200);
  }
}
</script>
</body>
</html>
