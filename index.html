<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Day</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial;
  color: white;
  overflow: hidden;

  background: linear-gradient(270deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);
  background-size: 1000% 1000%;
  animation: gradientMove 20s ease infinite;
}

@keyframes gradientMove {
  0% {background-position:0% 50%;}
  50% {background-position:100% 50%;}
  100% {background-position:0% 50%;}
}

/* キラキラ */
body::before {
  content: "";
  position: absolute;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(255,255,255,0.2) 1px, transparent 1px);
  background-size: 40px 40px;
  animation: sparkle 10s linear infinite;
}

@keyframes sparkle {
  from { transform: translate(0,0);}
  to { transform: translate(-100px,-100px);}
}

/* カード */
.container {
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(20px);
  border-radius: 20px;
  padding: 25px;
  width: 85%;
  max-width: 340px;
  text-align: center;

  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  opacity: 0;
  transform: translateY(30px);
  transition: 1s;
}

.container.show {
  opacity: 1;
  transform: translateY(0);
}

select, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 12px;
  border: none;
}

button {
  background: linear-gradient(45deg, #ff6a00, #ff0080);
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  transform: scale(1.05);
}

/* モーダル */
.modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;

  background: rgba(0,0,0,0.5);
  opacity: 0;
  pointer-events: none;
  transition: 0.3s;
}

.modal.show {
  opacity: 1;
  pointer-events: auto;
}

.modal-content {
  background: white;
  color: #333;
  padding: 30px;
  border-radius: 20px;
  text-align: center;
}
</style>
</head>

<body>

<div class="container" id="card">
  <h2>誕生日を選んでね🎂</h2>
  <select id="month"></select>
  <select id="day"></select>
  <button onclick="showMessage()">メッセージを見る</button>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <p id="modalMessage"></p>
    <button onclick="closeModal()">閉じる</button>
  </div>
</div>

<script>
const card = document.getElementById("card");
setTimeout(()=>card.classList.add("show"),500);

const monthSelect = document.getElementById("month");
const daySelect = document.getElementById("day");

monthSelect.innerHTML = '<option value="">月</option>';
daySelect.innerHTML = '<option value="">日</option>';

for (let i=1;i<=12;i++){
  monthSelect.innerHTML += `<option value="${i}">${i}月</option>`;
}

for (let i=1;i<=31;i++){
  daySelect.innerHTML += `<option value="${i}">${i}日</option>`;
}

function showMessage(){
  const m = monthSelect.value;
  const d = daySelect.value;

  if(!m || !d){
    alert("選んでね！");
    return;
  }

  const key = m+"-"+d;

  const messages = {
    "1-1":"最高のスタートの日✨",
    "4-13":"いつも一緒にいてくれてありがとう",
    "12-7":"あ！うそつきだ！",
    "2-14":"愛にあふれてる日💖",
    "7-7":"ロマンチックな日🌟",
    "12-25":"奇跡の存在🎄"
  };

  const msg = messages[key] || "あなたの誕生日は特別な日✨";

  document.getElementById("modalMessage").innerText = msg;
  document.getElementById("modal").classList.add("show");
}

function closeModal(){
  document.getElementById("modal").classList.remove("show");
}
</script>

</body>
</html>
