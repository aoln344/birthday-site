<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三好</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;height:100vh;display:flex;flex-direction:column}
header{height:82px;border-bottom:1px solid #eee;display:flex;align-items:center;padding:14px}
.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(45deg,#feda75,#d62976,#833ab4,#515bd4);padding:2px;margin-right:12px}
.avatar div{width:100%;height:100%;border-radius:50%;background:#222;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold}
.name{font-size:24px;font-weight:700}
.status{color:#888;font-size:14px}
.chat{flex:1;overflow:auto;padding:20px}
.time{text-align:center;color:#999;margin:12px}
.row{display:flex;margin:10px 0;align-items:flex-end}
.row.me{justify-content:flex-end}
.icon{width:28px;height:28px;border-radius:50%;background:#222;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;margin-right:8px}
.bubble{padding:12px 16px;border-radius:22px;max-width:72%;line-height:1.5}
.other{background:#f3f3f5;border-bottom-left-radius:6px}
.me .bubble{background:linear-gradient(135deg,#6f2cff,#8b3dff,#b15cff);color:#fff;border-bottom-right-radius:6px}
footer{padding:12px;border-top:1px solid #eee}
.input{display:flex;border:1px solid #ddd;border-radius:999px;padding:8px}
input{flex:1;border:none;outline:none;font-size:16px}
button{background:linear-gradient(135deg,#6f2cff,#a855f7);color:#fff;border:none;border-radius:999px;padding:8px 16px}
</style>
</head>
<body>
<header>
<div class="avatar"><div>三</div></div>
<div><div class="name">三好</div><div class="status">オンライン</div></div>
</header>

<div class="chat" id="chat">
<div class="time">今日 20:47</div>
</div>

<footer>
<div class="input">
<input id="msg" placeholder="メッセージを入力...">
<button onclick="send()">送信</button>
</div>
</footer>

<script>
const chat=document.getElementById('chat');
const intro=[
"えーなにしにきたのー😂",
"まさか5月8日まで\n覚えてるとは思わなかった。",
"せっかくだし少し話そ？"
];
let i=0;
function add(text,me=false){
 const row=document.createElement('div');
 row.className='row'+(me?' me':'');
 if(!me){
   const ic=document.createElement('div');
   ic.className='icon';
   ic.textContent='三';
   row.appendChild(ic);
 }
 const b=document.createElement('div');
 b.className='bubble '+(me?'':'other');
 b.innerText=text;
 row.appendChild(b);
 chat.appendChild(row);
 chat.scrollTop=chat.scrollHeight;
}
function next(){
 if(i<intro.length){
   setTimeout(()=>{
      add(intro[i++]);
      next();
   },1200);
 }
}
next();

const localReplies=[
"なにそれ笑",
"まあでも来てくれたのちょっとうれしい😂",
"最近どうなん？",
"ちゃんと返してよ笑",
"そーゆーとこあるよね🙃"
];

function send(){
 const input=document.getElementById('msg');
 const t=input.value.trim();
 if(!t)return;
 add(t,true);
 input.value='';
 setTimeout(()=>{
   add(localReplies[Math.floor(Math.random()*localReplies.length)]);
 },900);
}
document.getElementById('msg').addEventListener('keydown',e=>{
 if(e.key==='Enter')send();
});
</script>
</body>
</html>
