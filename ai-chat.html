<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>三好</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ig-blue:#0095f6;
  --ig-bg:#000;
  --ig-surface:#1a1a1a;
  --ig-border:#262626;
  --ig-text:#fff;
  --ig-muted:#a8a8a8;
  --ig-bubble-me:#3797ef;
  --ig-bubble-other:#262626;
}
html,body{height:100%;background:#000}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  color:var(--ig-text);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.app{
  height:100vh;
  height:100dvh;
  background:#000;
  display:flex;
  flex-direction:column;
  position:relative;
}

/* ─── Status bar ─── */
.statusbar{
  height:44px;
  padding:14px 20px 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:600;
  font-size:15px;
  flex-shrink:0;
}
.status-icons{
  display:flex;
  gap:6px;
  align-items:center;
}
.signal{display:flex;gap:1.5px;align-items:flex-end}
.signal span{
  width:3px;background:#fff;border-radius:1px;
}
.signal span:nth-child(1){height:5px}
.signal span:nth-child(2){height:8px}
.signal span:nth-child(3){height:11px}
.signal span:nth-child(4){height:14px}
.wifi{font-size:13px;letter-spacing:-1px}
.battery-wrap{
  display:flex;align-items:center;gap:2px;font-size:12px;
}
.battery-body{
  width:24px;height:12px;
  border:1.5px solid rgba(255,255,255,.65);
  border-radius:3px;
  padding:1.5px;
  position:relative;
}
.battery-body:after{
  content:"";
  position:absolute;
  right:-4px;top:3px;
  width:2.5px;height:5px;
  background:rgba(255,255,255,.5);
  border-radius:0 1px 1px 0;
}
.battery-fill{
  height:100%;
  width:80%;
  background:#fff;
  border-radius:1.5px;
}

/* ─── Header ─── */
.header{
  height:56px;
  padding:0 12px 0 4px;
  display:flex;
  align-items:center;
  gap:8px;
  flex-shrink:0;
  border-bottom:0.5px solid var(--ig-border);
}
.back-btn{
  width:44px;height:44px;
  border:0;background:transparent;
  display:grid;place-items:center;
  flex-shrink:0;
  cursor:pointer;
}
.back-arrow{
  width:11px;height:11px;
  border-left:2px solid #fff;
  border-bottom:2px solid #fff;
  transform:rotate(45deg);
  margin-left:4px;
}
.avatar-wrap{
  width:40px;height:40px;
  border-radius:50%;
  position:relative;
  flex-shrink:0;
}
.avatar-ring{
  width:40px;height:40px;
  border-radius:50%;
  background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);
  padding:2px;
  display:grid;place-items:center;
}
.avatar-inner{
  width:34px;height:34px;
  border-radius:50%;
  border:2px solid #000;
  background:#1a1a1a;
  display:grid;place-items:center;
  overflow:hidden;
}
/* udon avatar */
.udon{
  width:28px;height:28px;border-radius:50%;
  background:
    radial-gradient(ellipse at center,#f6e4b8 0 26%,transparent 27%),
    radial-gradient(ellipse at center,#d5963a 0 39%,transparent 40%),
    radial-gradient(ellipse at center,#f7e2ae 0 54%,transparent 55%),
    radial-gradient(ellipse at center,#2a2a2a 0 100%);
  position:relative;overflow:hidden;
}
.udon:before{
  content:"";position:absolute;
  width:8px;height:5px;border-radius:50%;
  background:#5ab86e;top:9px;left:10px;
  box-shadow:6px 2px 0 #75c783;
}
.udon:after{
  content:"";position:absolute;
  inset:6px;border:1.5px solid rgba(185,120,35,.4);
  border-radius:50%;transform:rotate(-12deg);
}
.active-dot{
  position:absolute;
  right:0;bottom:0;
  width:12px;height:12px;
  background:#09f709;
  border:2px solid #000;
  border-radius:50%;
}
.header-info{flex:1;cursor:pointer}
.header-name{
  font-size:14px;
  font-weight:700;
  color:#fff;
  letter-spacing:-.01em;
}
.header-sub{
  font-size:12px;
  color:var(--ig-muted);
  margin-top:1px;
}
.header-actions{
  display:flex;gap:4px;align-items:center;
}
.icon-btn{
  width:44px;height:44px;
  border:0;background:transparent;
  display:grid;place-items:center;
  cursor:pointer;
  border-radius:50%;
  position:relative;
}
.icon-btn:active{background:rgba(255,255,255,.08)}
/* phone icon */
.icon-phone svg,.icon-video svg,.icon-info svg{stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ─── Chat ─── */
.chat{
  flex:1;
  overflow-y:auto;
  padding:8px 0 4px;
  -webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;
  overscroll-behavior:contain;
}
.chat::-webkit-scrollbar{display:none}
.time-label{
  text-align:center;
  color:var(--ig-muted);
  font-size:12px;
  font-weight:400;
  margin:12px 0 8px;
  padding:0 16px;
}
.row{
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:1px 12px;
  margin:0;
}
.row.me{
  justify-content:flex-end;
}
.row.other{
  justify-content:flex-start;
}
.avatar-sm{
  width:28px;height:28px;
  border-radius:50%;
  background:#2a2a2a;
  display:grid;place-items:center;
  flex-shrink:0;
  overflow:hidden;
  margin-bottom:2px;
}
.avatar-sm .udon{width:24px;height:24px}
.avatar-sm.hidden{visibility:hidden}
.stack{
  display:flex;
  flex-direction:column;
  max-width:75%;
  gap:1px;
}
.row.me .stack{align-items:flex-end}
.row.other .stack{align-items:flex-start}

.bubble{
  width:fit-content;
  max-width:100%;
  padding:9px 14px;
  border-radius:22px;
  font-size:15px;
  line-height:1.4;
  white-space:pre-wrap;
  word-break:break-word;
  position:relative;
}
.row.me .bubble{
  background:var(--ig-bubble-me);
  color:#fff;
}
.row.other .bubble{
  background:var(--ig-bubble-other);
  color:#fff;
}
/* Corner shaping for grouped bubbles */
.row.me .bubble.top{border-top-right-radius:4px}
.row.me .bubble.mid{border-top-right-radius:4px;border-bottom-right-radius:4px}
.row.me .bubble.bot{border-bottom-right-radius:4px}
.row.other .bubble.top{border-top-left-radius:4px}
.row.other .bubble.mid{border-top-left-radius:4px;border-bottom-left-radius:4px}
.row.other .bubble.bot{border-bottom-left-radius:4px}

/* slide-in animation */
@keyframes slideIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
.bubble{animation:slideIn .2s ease both}

.seen{
  font-size:11px;
  color:var(--ig-muted);
  margin:2px 4px 4px;
}

/* ─── Typing indicator ─── */
.typing-row{
  display:flex;align-items:flex-end;gap:8px;padding:2px 12px;
}
.typing-bubble{
  background:var(--ig-bubble-other);
  border-radius:22px;
  width:52px;height:34px;
  display:flex;align-items:center;justify-content:center;
  gap:4px;
}
.dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--ig-muted);
  animation:blink 1.2s infinite ease-in-out;
}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes blink{
  0%,60%,100%{opacity:.3;transform:scale(1)}
  30%{opacity:1;transform:scale(1.15)}
}

/* ─── Input ─── */
.input-area{
  flex-shrink:0;
  border-top:0.5px solid var(--ig-border);
  padding:8px 12px calc(16px + env(safe-area-inset-bottom));
  display:flex;
  align-items:center;
  gap:8px;
  background:#000;
}
.input-shell{
  flex:1;
  min-height:40px;
  border:1.5px solid var(--ig-border);
  border-radius:22px;
  display:flex;
  align-items:center;
  gap:0;
  padding:0 14px;
  background:#000;
  transition:border-color .15s;
}
.input-shell:focus-within{
  border-color:#555;
}
input{
  flex:1;
  min-width:0;
  border:0;outline:0;
  font-size:15px;
  font-family:inherit;
  background:transparent;
  color:#fff;
  line-height:1.4;
  padding:9px 0;
}
input::placeholder{color:var(--ig-muted)}
.emoji-btn{
  width:30px;height:36px;
  background:transparent;border:0;
  font-size:22px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--ig-muted);
  flex-shrink:0;
}
/* icon buttons outside */
.side-icon{
  width:40px;height:40px;
  background:transparent;border:0;
  display:grid;place-items:center;
  cursor:pointer;
  flex-shrink:0;
  border-radius:50%;
}
.side-icon:active{background:rgba(255,255,255,.08)}
.side-icon svg{stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.send-btn{
  width:40px;height:40px;
  background:transparent;border:0;
  display:none;
  place-items:center;
  cursor:pointer;
  flex-shrink:0;
}
.send-btn.show{display:grid}
.send-btn svg{stroke:var(--ig-blue);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ─── Reactions popup (future) ─── */
.note-bar{
  text-align:center;
  color:#555;
  font-size:11px;
  padding-bottom:2px;
}

/* Desktop frame */
@media(min-width:700px){
  body{background:#121212;display:grid;place-items:center}
  .app{width:430px;height:90vh;max-height:900px;border:1px solid #262626;border-radius:12px;overflow:hidden}
}
</style>
</head>
<body>
<div class="app">

  <!-- Status Bar -->
  <div class="statusbar">
    <div style="font-size:15px;font-weight:600">9:41</div>
    <div class="status-icons">
      <div class="signal">
        <span></span><span></span><span></span><span></span>
      </div>
      <svg class="wifi" width="16" height="12" viewBox="0 0 24 18" fill="white" style="margin:0 2px">
        <path d="M1 6C5.5 1.5 18.5 1.5 23 6M4.5 9.5C7.5 6.5 16.5 6.5 19.5 9.5M8 13C9.5 11.5 14.5 11.5 16 13M12 17h.01" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </svg>
      <div class="battery-wrap">
        <div class="battery-body"><div class="battery-fill"></div></div>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="header">
    <button class="back-btn" onclick="history.back()">
      <div class="back-arrow"></div>
    </button>
    <div class="avatar-wrap">
      <div class="avatar-ring">
        <div class="avatar-inner">
          <div class="udon"></div>
        </div>
      </div>
      <div class="active-dot"></div>
    </div>
    <div class="header-info">
      <div class="header-name">三好</div>
      <div class="header-sub">アクティブ中</div>
    </div>
    <div class="header-actions">
      <!-- Phone -->
      <button class="icon-btn icon-phone">
        <svg width="22" height="22" viewBox="0 0 24 24">
          <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.09 10.8a19.79 19.79 0 01-3.07-8.68A2 2 0 012 0h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 14.92v2z" transform="translate(1,1)"/>
        </svg>
      </button>
      <!-- Video -->
      <button class="icon-btn icon-video">
        <svg width="22" height="22" viewBox="0 0 24 24">
          <polygon points="23 7 16 12 23 17 23 7"/>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
        </svg>
      </button>
      <!-- Info -->
      <button class="icon-btn icon-info">
        <svg width="22" height="22" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Chat -->
  <main class="chat" id="chat"></main>

  <!-- Input Area -->
  <footer class="input-area">
    <!-- Camera -->
    <button class="side-icon" id="cam-btn">
      <svg width="28" height="28" viewBox="0 0 24 24">
        <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
    </button>
    <div class="input-shell">
      <input id="input" placeholder="メッセージを入力..." autocomplete="off">
      <button class="emoji-btn" id="emoji-btn">😊</button>
    </div>
    <!-- Hidden when typing — mic, gallery, gif -->
    <div id="idle-btns" style="display:flex;gap:0;align-items:center">
      <button class="side-icon">
        <svg width="26" height="26" viewBox="0 0 24 24">
          <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
          <path d="M19 10v2a7 7 0 01-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <button class="side-icon">
        <svg width="26" height="26" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
      </button>
      <button class="side-icon" style="font-size:11px;font-weight:700;color:#fff;letter-spacing:-.03em">GIF</button>
    </div>
    <!-- Send button (shown when typing) -->
    <button class="send-btn" id="send-btn">
      <svg width="28" height="28" viewBox="0 0 24 24">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </footer>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send-btn");
const idleBtns = document.getElementById("idle-btns");
const camBtn = document.getElementById("cam-btn");

const API_URL = "https://birthday-site-delta-peach.vercel.app/api/chat";
const historyMessages = [];

const fallbacks = [
  "え、なにそれ笑",
  "ちょっと待ってそれ気になる😂",
  "まあ来てくれたのはちょっとうれしいかも",
  "最近なにしてるの？",
  "そーゆーとこあるよね🙃"
];

const sleep = ms => new Promise(r => setTimeout(r, ms));
const rand = (a, b) => Math.floor(a + Math.random() * (b - a));
const bottom = () => requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight });

// avatar element
function makeAvatar(visible = true) {
  const a = document.createElement("div");
  a.className = "avatar-sm" + (visible ? "" : " hidden");
  const u = document.createElement("div");
  u.className = "udon";
  a.appendChild(u);
  return a;
}

let lastWho = null;

function addMessage(text, who = "other", opts = {}) {
  // clear old "seen" badges
  document.querySelectorAll(".seen").forEach(e => e.remove());

  const row = document.createElement("div");
  row.className = "row " + who;

  const showAvatar = (who === "other");
  if (showAvatar) row.appendChild(makeAvatar(true));

  const stack = document.createElement("div");
  stack.className = "stack";

  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  stack.appendChild(b);

  if (who === "me") {
    const seen = document.createElement("div");
    seen.className = "seen";
    seen.textContent = "既読";
    stack.appendChild(seen);
  }

  row.appendChild(stack);
  chat.appendChild(row);
  bottom();

  if (!opts.skipHistory) {
    historyMessages.push({ role: who === "me" ? "user" : "assistant", content: text });
  }

  lastWho = who;
}

function addTyping() {
  removeTyping();
  const row = document.createElement("div");
  row.className = "typing-row";
  row.id = "typing";
  row.appendChild(makeAvatar(true));
  const b = document.createElement("div");
  b.className = "typing-bubble";
  b.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  row.appendChild(b);
  chat.appendChild(row);
  bottom();
}
function removeTyping() {
  const t = document.getElementById("typing");
  if (t) t.remove();
}

async function say(text, min = 900, max = 1700) {
  addTyping();
  await sleep(rand(min, max));
  removeTyping();
  addMessage(text);
}

async function intro() {
  // time label
  const t = document.createElement("div");
  t.className = "time-label";
  t.textContent = "今日 20:47";
  chat.appendChild(t);

  await sleep(500);
  await say("えーなにしにきたのー😂", 900, 1400);
  await sleep(200);
  await say("まさか5月8日まで覚えてるとは思わなかった。", 1000, 1800);
  await sleep(200);
  await say("せっかくだし少し話そ？", 700, 1300);
}

// Input UI toggle
function updateInput() {
  const has = input.value.trim().length > 0;
  sendBtn.classList.toggle("show", has);
  idleBtns.style.display = has ? "none" : "flex";
  camBtn.style.display = has ? "none" : "grid";
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  addMessage(text, "me");
  input.value = "";
  updateInput();
  input.disabled = true;
  sendBtn.disabled = true;
  addTyping();

  try {
    const start = Date.now();
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, history: historyMessages.slice(-12) })
    });
    if (!res.ok) throw new Error("api " + res.status);
    const data = await res.json();
    const reply = data.reply || "んー、なんて返せばいいかわからん笑";
    const elapsed = Date.now() - start;
    if (elapsed < 800) await sleep(800 - elapsed);
    removeTyping();
    addMessage(reply);
  } catch (e) {
    console.error(e);
    await sleep(600);
    removeTyping();
    addMessage(fallbacks[Math.floor(Math.random() * fallbacks.length)]);
  }

  input.disabled = false;
  sendBtn.disabled = false;
  input.focus();
}

sendBtn.addEventListener("click", send);
input.addEventListener("input", updateInput);
input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); send(); } });
intro();
</script>
</body>
</html>
